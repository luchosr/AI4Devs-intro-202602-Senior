<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reverse String</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 40px;
        color: #333;
      }
      .container {
        max-width: 500px;
      }
      h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
      }
      input {
        width: 100%;
        padding: 12px;
        font-size: 1.1rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 15px;
        box-sizing: border-box;
      }
      button {
        padding: 10px 20px;
        font-size: 1rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        color: white;
        margin-bottom: 15px;
      }
      #reverseBtn {
        background-color: #3b82f6;
        display: none; /* Oculto inicialmente */
      }
      #reverseBtn:hover {
        background-color: #2563eb;
      }
      #copyBtn {
        background-color: #6b7280;
        display: none; /* Se muestra solo cuando hay resultado */
      }
      #copyBtn:hover {
        background-color: #4b5563;
      }
      #result {
        font-size: 1.2rem;
        margin: 15px 0;
        min-height: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Reverse String</h1>
      <input type="text" id="userInput" placeholder="Escribe algo aquí..." />

      <button id="reverseBtn">Reverse 🔄</button>

      <p id="result"></p>

      <button id="copyBtn" style="display: none">Copy 📋</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
